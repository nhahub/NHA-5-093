                $ref: ./schemas/ErrorResponse.schema.json
        '422':
          description: Schema validation error
          content:
            application/json:
              schema:
                $ref: ./schemas/ErrorResponse.schema.json
        '503':
          description: Provider or engine unavailable
          content:
            application/json:
              schema:
                $ref: ./schemas/ErrorResponse.schema.json
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
  /api/v1/runs/{run_id}/findings:
