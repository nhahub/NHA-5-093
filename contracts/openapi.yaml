  /api/v1/reports/{batch_id}:
    get:
      operationId: getReport
      tags:
      - HireGuard
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: ./schemas/ReportSummary.schema.json
            text/csv:
