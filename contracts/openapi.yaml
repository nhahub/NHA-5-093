openapi: 3.1.0
info:
  title: HireGuard Local MVP API
  version: 1.0.0
  description: Proposed canonical interface baseline pending lead ADR sign-off. Paths
    are local-only. Versioned changes require consumer approval.
servers:
- url: http://localhost:8000
paths:
  /health:
    get:
      operationId: health
      tags:
      - HireGuard
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ok
        '400':
          description: Validation or missing required fields
          content:
            application/json:
              schema:
                $ref: ./schemas/ErrorResponse.schema.json
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: ./schemas/ErrorResponse.schema.json
        '409':
          description: Illegal state transition, version mismatch or duplicate
          content:
            application/json:
              schema:
                $ref: ./schemas/ErrorResponse.schema.json
        '422':
          description: Schema validation error
          content:
            application/json:
              schema:
                $ref: ./schemas/ErrorResponse.schema.json
        '503':
          description: Provider or engine unavailable
          content:
            application/json:
              schema:
                $ref: ./schemas/ErrorResponse.schema.json
  /api/v1/config:
    get:
      operationId: getConfig
      tags:
      - HireGuard
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: ./schemas/ConfigResponse.schema.json
        '400':
          description: Validation or missing required fields
          content:
            application/json:
              schema:
                $ref: ./schemas/ErrorResponse.schema.json
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: ./schemas/ErrorResponse.schema.json
        '409':
          description: Illegal state transition, version mismatch or duplicate
