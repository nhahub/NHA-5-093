    get:
      operationId: getRun
      tags:
      - HireGuard
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: ./schemas/RunDetail.schema.json
        '400':
          description: Validation or missing required fields
          content:
            application/json:
