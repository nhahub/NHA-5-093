                $ref: ./schemas/ErrorResponse.schema.json
        '503':
          description: Provider or engine unavailable
          content:
            application/json:
              schema:
                $ref: ./schemas/ErrorResponse.schema.json
  /api/v1/runs:
    post:
      operationId: createRun
      tags:
      - HireGuard
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: ./schemas/RunReceipt.schema.json
        '400':
          description: Validation or missing required fields
          content:
            application/json:
              schema:
                $ref: ./schemas/ErrorResponse.schema.json
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: ./schemas/ErrorResponse.schema.json
        '409':
          description: Illegal state transition, version mismatch or duplicate
          content:
            application/json:
              schema:
                $ref: ./schemas/ErrorResponse.schema.json
        '422':
          description: Schema validation error
          content:
            application/json:
              schema:
                $ref: ./schemas/ErrorResponse.schema.json
        '503':
          description: Provider or engine unavailable
          content:
            application/json:
              schema:
                $ref: ./schemas/ErrorResponse.schema.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/RunCreate.schema.json
