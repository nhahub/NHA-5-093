          content:
            application/json:
              schema:
                $ref: ./schemas/ErrorResponse.schema.json
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
  /api/v1/runs/{run_id}/events:
    get:
      operationId: getRunEvents
      tags:
      - HireGuard
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: ./schemas/AuditEvent.schema.json
                  next_cursor:
                    type:
                    - string
                    - 'null'
        '400':
          description: Validation or missing required fields
          content:
            application/json:
              schema:
                $ref: ./schemas/ErrorResponse.schema.json
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: ./schemas/ErrorResponse.schema.json
        '409':
          description: Illegal state transition, version mismatch or duplicate
          content:
            application/json:
