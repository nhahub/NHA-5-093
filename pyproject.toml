[project]
name = "hireguard-integration"
version = "0.1.0"
description = "M1 contract validation and local integration tooling"
requires-python = ">=3.11,<3.12"
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "PyYAML>=6.0.2,<7",
  "referencing>=0.36,<1",
  "openapi-spec-validator>=0.7.2,<0.8",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<0.12", "httpx>=0.28,<0.29"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "packages/*"]
exclude = ["services/__pycache__", "packages/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
markers = ["ollama: explicitly opted-in local model tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["scripts/**/*.py", "tests/**/*.py", "services/**/*.py", "packages/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
